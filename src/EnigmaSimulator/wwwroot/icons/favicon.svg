<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#3a2a1a"/>
      <stop offset="1" stop-color="#140e09"/>
    </radialGradient>
    <linearGradient id="drum" x1="0" x2="1">
      <stop offset="0" stop-color="#0b0b0b"/>
      <stop offset=".2" stop-color="#4a4d52"/>
      <stop offset=".5" stop-color="#b5b8bd"/>
      <stop offset=".8" stop-color="#4a4d52"/>
      <stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".75"/>
      <stop offset=".3" stop-color="#000" stop-opacity="0"/>
      <stop offset=".7" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".75"/>
    </linearGradient>
  </defs>
  <!-- full-bleed background so the PNGs work as maskable icons -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- brass rotor ring with knurled edge -->
  <circle cx="256" cy="256" r="196" fill="#8a6d2c"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#c9a54e" stroke-width="22" stroke-dasharray="14 10"/>
  <circle cx="256" cy="256" r="168" fill="#2a2620" stroke="#c9a54e" stroke-width="8"/>
  <!-- rotor window: drum showing D / E / F -->
  <rect x="166" y="96" width="180" height="320" rx="22" fill="url(#drum)" stroke="#777" stroke-width="6"/>
  <rect x="176" y="118" width="160" height="62" fill="#cfc8b3"/>
  <rect x="176" y="332" width="160" height="62" fill="#cfc8b3"/>
  <rect x="176" y="186" width="160" height="140" fill="#efe9d6"/>
  <text x="256" y="168" text-anchor="middle" font-family="Courier New, Consolas, monospace" font-weight="700" font-size="58" fill="#333">D</text>
  <text x="256" y="382" text-anchor="middle" font-family="Courier New, Consolas, monospace" font-weight="700" font-size="58" fill="#333">F</text>
  <text x="256" y="300" text-anchor="middle" font-family="Courier New, Consolas, monospace" font-weight="700" font-size="140" fill="#101010">E</text>
  <rect x="166" y="96" width="180" height="320" rx="22" fill="url(#shade)"/>
  <!-- turnover notch -->
  <rect x="326" y="236" width="20" height="40" rx="4" fill="#111" stroke="#c9a54e" stroke-width="4"/>
</svg>
